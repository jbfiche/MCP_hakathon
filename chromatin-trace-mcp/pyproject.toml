[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chromatin-trace-mcp"
version = "0.1.0"
description = "A minimal MCP server that exposes one chromatin-tracing ECSV file as a resource."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.1,<3",
    "numpy",
    "pydantic>=2,<3",
    "traceratops @ git+https://github.com/pyHi-M/traceratops.git@main",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[project.scripts]
chromatin-trace-mcp = "chromatin_trace_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/chromatin_trace_mcp"]

[tool.hatch.metadata]
# traceratops is installed directly from its GitHub repository because this
# pyHi-M package is not currently distributed through PyPI.
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
